[package]
name = "p4inz-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.22"
p4inz-common = { version = "0.1.0", path = "../common" }
p4inz-domain = { version = "0.1.0", path = "../domain" }
p4inz-errors = { version = "0.1.0", path = "../errors" }
p4inz-jobs = { version = "0.1.0", path = "../jobs" }
p4inz-knowledge = { version = "0.1.0", path = "../knowledge" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time"] }
thiserror = "2.0.20"
time = "0.3.45"
tokio = { version = "1.53.1", features = ["time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
p4inz-config = { path = "../config" }
p4inz-database = { path = "../database" }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
