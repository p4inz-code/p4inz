[workspace]
resolver = "3"
members = [
    "apps/p4inz",
    "apps/p4inz-worker",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/api",
    "crates/discord",
    "crates/knowledge",
    "crates/search",
    "crates/ai",
    "crates/security",
    "crates/observability",
    "crates/jobs",
    "crates/database",
    "crates/config",
    "crates/errors",
    "crates/audit",
    "crates/common",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/p4inz-code/p4inz"
homepage = "https://github.com/p4inz-code/p4inz"
rust-version = "1.85"
authors = ["Northbyte Studios"]

# Performance/resource baseline (Milestone 67). Debug symbols aren't
# useful in a deployed binary (`infra/deployment/`, `infra/docker/`) and
# meaningfully inflate its size on disk and in a container image — no
# behavioral change, so no reason not to strip them. LTO is deliberately
# not enabled: this is a mostly I/O-bound service (network/database), so
# LTO's runtime-speed benefit is marginal here, while its build-time cost
# is real and immediate on every release build.
[profile.release]
strip = true
